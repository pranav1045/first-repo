<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
        
   
    #name{
        background-color: rgb(0, 173, 141);
        height: 200px;
        text-align: justify;
        width:50vh;
        margin-left: 450px;
        border: 10px solid red;
        color: blue;
       
    }
    
    #box1{
        margin-left: 20px;
       text-transform: capitalize;
       font-size: large;
       font-style: inherit;
    }
    #box2{
        margin-left: 20px;
        text-transform: capitalize;
    }
    #box3{
        margin-left: 150px;
       box-sizing: content-box;
       text-transform: uppercase;
      
       
    }
    
    
        
    
</style>
<body>
   
    <div id="name">
        <form>
            <h1 style="text-align: center;font-family: Arial, Helvetica, sans-serif; font-size:larger;">Login</h1>
         <div id="box1">
            <label for="email">Enter email :
            <input type="email" placeholder="enter email address">
          </label>
        </div>
          <br><br>
          <div id="box2">
            <label for="password">Enter password:
            <input type="password" placeholder="enter 6 char password" >
          </label>
        </div>
          <br><br>
          <div id="box3">
            <input type="button" value="submit">
        </div>
        </form>
    </div>
    
</body>
</html>
